name: Fetch line-art notions
# One-off: downloads the public-domain Pearson Scott Foresman drawings from Wikimedia Commons
# into public/notions/ and commits them. Run it from the Actions tab → "Run workflow".
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fetch-notions.yml', 'scripts/fetch-notions.mjs']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Skip if the originals are already in place
        id: need
        run: grep -q "placeholder" public/notions/*.svg && echo "go=1" >> "$GITHUB_OUTPUT" || echo "Originals already present"
      - if: steps.need.outputs.go == '1'
        run: npm run notions:fetch
      - name: Commit
        if: steps.need.outputs.go == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/notions
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Replace placeholder notions with Pearson Scott Foresman originals"
          git push
